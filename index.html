<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#075e54">

  <title>Vince Groupe</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --green-dark: #075e54;
      --green: #128c7e;
      --green-light: #25d366;
      --message-green: #d9fdd3;
      --background: #efeae2;
      --white: #ffffff;
      --text: #111b21;
      --muted: #667781;
      --border: #e2e8f0;
      --danger: #dc2626;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(37, 211, 102, 0.22), transparent 35%),
        linear-gradient(145deg, #075e54, #128c7e);
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: none;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .hidden {
      display: none !important;
    }

    .screen {
      min-height: 100vh;
    }

    /* ACCUEIL */

    #homeScreen {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .home-card {
      width: min(100%, 480px);
      padding: 38px 26px;
      text-align: center;
      background: rgba(255, 255, 255, 0.97);
      border-radius: 28px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.25);
    }

    .logo {
      display: flex;
      width: 86px;
      height: 86px;
      margin: 0 auto 20px;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      background: var(--green-light);
      border-radius: 26px;
      box-shadow: 0 14px 30px rgba(37, 211, 102, 0.35);
    }

    h1 {
      margin-bottom: 9px;
      font-size: 34px;
    }

    .subtitle {
      margin-bottom: 30px;
      color: var(--muted);
      line-height: 1.5;
    }

    .input-group {
      margin-bottom: 15px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      color: var(--text);
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 13px;
      outline: none;
      transition: 0.2s;
    }

    input:focus {
      background: white;
      border-color: var(--green);
      box-shadow: 0 0 0 4px rgba(18, 140, 126, 0.12);
    }

    #joinCodeInput {
      text-transform: uppercase;
    }

    .primary-button,
    .secondary-button {
      width: 100%;
      padding: 15px 18px;
      border-radius: 13px;
      font-weight: 750;
      transition: transform 0.15s, opacity 0.15s;
    }

    .primary-button {
      color: white;
      background: var(--green);
    }

    .primary-button:hover:not(:disabled),
    .secondary-button:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    .secondary-button {
      color: var(--green-dark);
      background: #e7f8f1;
    }

    .separator {
      display: flex;
      margin: 22px 0;
      align-items: center;
      gap: 12px;
      color: #94a3b8;
      font-size: 13px;
    }

    .separator::before,
    .separator::after {
      content: "";
      height: 1px;
      flex: 1;
      background: var(--border);
    }

    .error-message {
      min-height: 20px;
      margin-top: 12px;
      color: var(--danger);
      font-size: 14px;
    }

    /* SALLE D’ATTENTE */

    #waitingScreen {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .waiting-card {
      width: min(100%, 520px);
      overflow: hidden;
      background: white;
      border-radius: 26px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.25);
    }

    .waiting-header {
      padding: 28px;
      color: white;
      text-align: center;
      background: var(--green-dark);
    }

    .waiting-header h2 {
      margin-bottom: 7px;
      font-size: 25px;
    }

    .group-code-box {
      margin: 22px 24px 16px;
      padding: 18px;
      text-align: center;
      background: #f0fdf4;
      border: 1px dashed var(--green);
      border-radius: 16px;
    }

    .group-code-box small {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
    }

    #displayGroupCode {
      display: block;
      margin-bottom: 11px;
      color: var(--green-dark);
      font-size: 32px;
      font-weight: 850;
      letter-spacing: 5px;
    }

    .copy-button {
      padding: 9px 16px;
      color: white;
      background: var(--green);
      border-radius: 10px;
    }

    .waiting-content {
      padding: 8px 24px 26px;
    }

    .participants-title {
      display: flex;
      margin: 17px 0 12px;
      align-items: center;
      justify-content: space-between;
    }

    .online-badge {
      padding: 5px 10px;
      color: #166534;
      background: #dcfce7;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 750;
    }

    .participants-list {
      display: grid;
      margin-bottom: 22px;
      gap: 10px;
    }

    .participant {
      display: flex;
      padding: 11px;
      align-items: center;
      gap: 11px;
      background: #f8fafc;
      border-radius: 13px;
    }

    .avatar {
      display: flex;
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 17px;
      font-weight: 800;
      background: var(--green);
      border-radius: 50%;
    }

    .participant-info {
      flex: 1;
    }

    .participant-name {
      font-weight: 700;
    }

    .participant-role {
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
    }

    .online-dot {
      width: 10px;
      height: 10px;
      background: var(--green-light);
      border: 2px solid white;
      border-radius: 50%;
      box-shadow: 0 0 0 2px #bbf7d0;
    }

    .waiting-text {
      margin: 14px 0;
      color: var(--muted);
      text-align: center;
      font-size: 14px;
      line-height: 1.45;
    }

    .leave-button {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      color: var(--danger);
      background: transparent;
    }

    /* CHAT */

    #chatScreen {
      height: 100vh;
      overflow: hidden;
      background: #d7dbd9;
    }

    .chat-app {
      display: flex;
      width: min(100%, 920px);
      height: 100%;
      margin: auto;
      flex-direction: column;
      background: var(--background);
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.2);
    }

    .chat-header {
      display: flex;
      min-height: 68px;
      padding: 10px 15px;
      align-items: center;
      gap: 12px;
      color: white;
      background: var(--green-dark);
    }

    .back-button {
      padding: 8px;
      color: white;
      font-size: 25px;
      background: transparent;
    }

    .group-avatar {
      display: flex;
      width: 45px;
      height: 45px;
      align-items: center;
      justify-content: center;
      font-size: 23px;
      background: #dfe5e7;
      border-radius: 50%;
    }

    .chat-header-info {
      min-width: 0;
      flex: 1;
    }

    .chat-header-info h2 {
      overflow: hidden;
      font-size: 17px;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .chat-header-info p {
      overflow: hidden;
      margin-top: 3px;
      color: rgba(255, 255, 255, 0.8);
      font-size: 12px;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px clamp(10px, 4vw, 55px);
      background-color: var(--background);
      background-image:
        radial-gradient(rgba(0, 0, 0, 0.035) 1px, transparent 1px);
      background-size: 18px 18px;
    }

    .day-label {
      width: max-content;
      margin: 2px auto 18px;
      padding: 6px 11px;
      color: #54656f;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 8px;
      font-size: 12px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.09);
    }

    .system-message {
      width: fit-content;
      max-width: 85%;
      margin: 8px auto;
      padding: 7px 11px;
      color: #54656f;
      text-align: center;
      background: #ffeecd;
      border-radius: 8px;
      font-size: 12px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.09);
    }

    .message-row {
      display: flex;
      margin: 4px 0;
    }

    .message-row.mine {
      justify-content: flex-end;
    }

    .message-bubble {
      position: relative;
      max-width: min(75%, 560px);
      padding: 7px 9px 6px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.13);
    }

    .message-row.mine .message-bubble {
      background: var(--message-green);
    }

    .message-author {
      margin-bottom: 3px;
      color: #d97706;
      font-size: 12px;
      font-weight: 750;
    }

    .message-text {
      padding-right: 48px;
      overflow-wrap: anywhere;
      line-height: 1.35;
      white-space: pre-wrap;
    }

    .message-time {
      position: absolute;
      right: 7px;
      bottom: 5px;
      color: #667781;
      font-size: 10px;
    }

    .composer {
      display: flex;
      padding: 9px 11px;
      align-items: flex-end;
      gap: 9px;
      background: #f0f2f5;
    }

    .composer input {
      padding: 13px 16px;
      background: white;
      border: none;
      border-radius: 24px;
      box-shadow: none;
    }

    .send-button {
      display: flex;
      width: 47px;
      height: 47px;
      flex: 0 0 47px;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 20px;
      background: var(--green);
      border-radius: 50%;
    }

    @media (max-width: 560px) {
      #homeScreen,
      #waitingScreen {
        align-items: stretch;
        padding: 0;
      }

      .home-card,
      .waiting-card {
        width: 100%;
        min-height: 100vh;
        border-radius: 0;
      }

      .home-card {
        display: flex;
        padding: 35px 21px;
        flex-direction: column;
        justify-content: center;
      }

      .waiting-card {
        display: flex;
        flex-direction: column;
      }

      .waiting-content {
        flex: 1;
      }

      .message-bubble {
        max-width: 86%;
      }
    }
  </style>
</head>

<body>
  <!-- ACCUEIL -->
  <section id="homeScreen" class="screen">
    <main class="home-card">
      <div class="logo">💬</div>

      <h1>Vince Groupe</h1>
      <p class="subtitle">
        Crée un groupe, invite tes amis et discutez tous ensemble.
      </p>

      <div class="input-group">
        <label for="nameInput">Ton prénom</label>
        <input
          id="nameInput"
          type="text"
          maxlength="25"
          placeholder="Exemple : Vincent"
          autocomplete="off"
        >
      </div>

      <button id="createButton" class="primary-button">
        Créer un groupe
      </button>

      <div class="separator">OU</div>

      <div class="input-group">
        <label for="joinCodeInput">Code du groupe</label>
        <input
          id="joinCodeInput"
          type="text"
          maxlength="6"
          placeholder="Exemple : A4B9K2"
          autocomplete="off"
        >
      </div>

      <button id="joinButton" class="secondary-button">
        Rejoindre le groupe
      </button>

      <p id="homeError" class="error-message"></p>
    </main>
  </section>

  <!-- SALLE D’ATTENTE -->
  <section id="waitingScreen" class="screen hidden">
    <main class="waiting-card">
      <header class="waiting-header">
        <h2 id="waitingGroupName">Mon groupe</h2>
        <p>En attente des participants</p>
      </header>

      <div class="group-code-box">
        <small>Code à envoyer aux autres participants</small>
        <strong id="displayGroupCode">------</strong>
        <button id="copyCodeButton" class="copy-button">
          Copier le code
        </button>
      </div>

      <div class="waiting-content">
        <div class="participants-title">
          <strong>Participants</strong>
          <span id="onlineBadge" class="online-badge">0 connecté</span>
        </div>

        <div id="participantsList" class="participants-list"></div>

        <p id="waitingInformation" class="waiting-text">
          Il faut au moins deux personnes pour commencer.
        </p>

        <button id="continueButton" class="primary-button hidden" disabled>
          Continuer vers le chat
        </button>

        <button id="leaveWaitingButton" class="leave-button">
          Quitter le groupe
        </button>
      </div>
    </main>
  </section>

  <!-- CHAT -->
  <section id="chatScreen" class="screen hidden">
    <main class="chat-app">
      <header class="chat-header">
        <button id="backToWaitingButton" class="back-button" title="Retour">
          ‹
        </button>

        <div class="group-avatar">👥</div>

        <div class="chat-header-info">
          <h2 id="chatGroupName">Groupe</h2>
          <p id="chatMembersText">Participants</p>
        </div>
      </header>

      <div id="messagesContainer" class="messages">
        <div class="day-label">Aujourd’hui</div>
      </div>

      <form id="messageForm" class="composer">
        <input
          id="messageInput"
          type="text"
          maxlength="1000"
          placeholder="Écrire un message"
          autocomplete="off"
        >

        <button class="send-button" type="submit" title="Envoyer">
          ➤
        </button>
      </form>
    </main>
  </section>

  <script>
    const STORAGE_PREFIX = "vince_groupe_";
    const CHANNEL_NAME = "vince_groupe_updates";

    const channel = "BroadcastChannel" in window
      ? new BroadcastChannel(CHANNEL_NAME)
      : null;

    const state = {
      userId: sessionStorage.getItem("vince_user_id") || createId(),
      userName: "",
      groupCode: "",
      isCreator: false
    };

    sessionStorage.setItem("vince_user_id", state.userId);

    const homeScreen = document.getElementById("homeScreen");
    const waitingScreen = document.getElementById("waitingScreen");
    const chatScreen = document.getElementById("chatScreen");

    const nameInput = document.getElementById("nameInput");
    const joinCodeInput = document.getElementById("joinCodeInput");
    const homeError = document.getElementById("homeError");

    const createButton = document.getElementById("createButton");
    const joinButton = document.getElementById("joinButton");
    const copyCodeButton = document.getElementById("copyCodeButton");
    const continueButton = document.getElementById("continueButton");
    const leaveWaitingButton = document.getElementById("leaveWaitingButton");
    const backToWaitingButton = document.getElementById("backToWaitingButton");

    const displayGroupCode = document.getElementById("displayGroupCode");
    const waitingGroupName = document.getElementById("waitingGroupName");
    const participantsList = document.getElementById("participantsList");
    const onlineBadge = document.getElementById("onlineBadge");
    const waitingInformation = document.getElementById("waitingInformation");

    const chatGroupName = document.getElementById("chatGroupName");
    const chatMembersText = document.getElementById("chatMembersText");
    const messagesContainer = document.getElementById("messagesContainer");
    const messageForm = document.getElementById("messageForm");
    const messageInput = document.getElementById("messageInput");

    function createId() {
      return crypto.randomUUID
        ? crypto.randomUUID()
        : Date.now() + "_" + Math.random().toString(36).slice(2);
    }

    function createGroupCode() {
      const characters = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let code = "";

      for (let i = 0; i < 6; i++) {
        code += characters[Math.floor(Math.random() * characters.length)];
      }

      return code;
    }

    function groupStorageKey(code) {
      return STORAGE_PREFIX + code.toUpperCase();
    }

    function saveGroup(group) {
      localStorage.setItem(
        groupStorageKey(group.code),
        JSON.stringify(group)
      );

      if (channel) {
        channel.postMessage({
          type: "group-update",
          code: group.code
        });
      }
    }

    function getGroup(code = state.groupCode) {
      if (!code) return null;

      const savedGroup = localStorage.getItem(groupStorageKey(code));

      if (!savedGroup) return null;

      try {
        return JSON.parse(savedGroup);
      } catch {
        return null;
      }
    }

    function showScreen(screenName) {
      homeScreen.classList.toggle("hidden", screenName !== "home");
      waitingScreen.classList.toggle("hidden", screenName !== "waiting");
      chatScreen.classList.toggle("hidden", screenName !== "chat");
    }

    function getValidatedName() {
      const name = nameInput.value.trim();

      if (name.length < 2) {
        homeError.textContent = "Entre un prénom d’au moins deux lettres.";
        nameInput.focus();
        return null;
      }

      homeError.textContent = "";
      return name;
    }

    function createGroup() {
      const name = getValidatedName();
      if (!name) return;

      let code = createGroupCode();

      while (getGroup(code)) {
        code = createGroupCode();
      }

      const group = {
        code,
        name: "Groupe de " + name,
        creatorId: state.userId,
        phase: "waiting",
        createdAt: Date.now(),
        members: [
          {
            id: state.userId,
            name,
            joinedAt: Date.now()
          }
        ],
        messages: [
          {
            id: createId(),
            type: "system",
            text: name + " a créé le groupe.",
            createdAt: Date.now()
          }
        ]
      };

      state.userName = name;
      state.groupCode = code;
      state.isCreator = true;

      saveGroup(group);
      openWaitingRoom();
    }

    function joinGroup() {
      const name = getValidatedName();
      if (!name) return;

      const code = joinCodeInput.value
        .trim()
        .toUpperCase()
        .replace(/\s/g, "");

      if (code.length !== 6) {
        homeError.textContent = "Le code du groupe doit contenir 6 caractères.";
        joinCodeInput.focus();
        return;
      }

      const group = getGroup(code);

      if (!group) {
        homeError.textContent = "Ce groupe n’existe pas ou le code est incorrect.";
        return;
      }

      const alreadyMember = group.members.find(
        member => member.id === state.userId
      );

      if (!alreadyMember) {
        group.members.push({
          id: state.userId,
          name,
          joinedAt: Date.now()
        });

        group.messages.push({
          id: createId(),
          type: "system",
          text: name + " a rejoint le groupe.",
          createdAt: Date.now()
        });
      }

      state.userName = name;
      state.groupCode = code;
      state.isCreator = group.creatorId === state.userId;

      saveGroup(group);

      if (group.phase === "chat") {
        openChat();
      } else {
        openWaitingRoom();
      }
    }

    function openWaitingRoom() {
      const group = getGroup();
      if (!group) return returnHome();

      state.isCreator = group.creatorId === state.userId;

      displayGroupCode.textContent = group.code;
      waitingGroupName.textContent = group.name;

      renderParticipants(group);

      continueButton.classList.toggle("hidden", !state.isCreator);

      if (state.isCreator) {
        const canContinue = group.members.length >= 2;

        continueButton.disabled = !canContinue;

        waitingInformation.textContent = canContinue
          ? "Tout est prêt. Tu peux maintenant ouvrir le chat."
          : "Il faut au moins deux personnes pour commencer.";
      } else {
        waitingInformation.textContent =
          "Le créateur ouvrira le chat dès que tout le monde sera prêt.";
      }

      showScreen("waiting");
    }

    function renderParticipants(group) {
      participantsList.innerHTML = "";

      group.members.forEach(member => {
        const participant = document.createElement("div");
        participant.className = "participant";

        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = member.name.charAt(0).toUpperCase();

        const info = document.createElement("div");
        info.className = "participant-info";

        const participantName = document.createElement("div");
        participantName.className = "participant-name";
        participantName.textContent =
          member.name + (member.id === state.userId ? " (toi)" : "");

        const role = document.createElement("div");
        role.className = "participant-role";
        role.textContent =
          member.id === group.creatorId ? "Créateur du groupe" : "Participant";

        const dot = document.createElement("div");
        dot.className = "online-dot";

        info.append(participantName, role);
        participant.append(avatar, info, dot);
        participantsList.appendChild(participant);
      });

      const count = group.members.length;

      onlineBadge.textContent =
        count + (count > 1 ? " connectés" : " connecté");
    }

    function startChat() {
      const group = getGroup();

      if (!group || group.creatorId !== state.userId) return;
      if (group.members.length < 2) return;

      group.phase = "chat";

      group.messages.push({
        id: createId(),
        type: "system",
        text: "La discussion a commencé.",
        createdAt: Date.now()
      });

      saveGroup(group);
      openChat();
    }

    function openChat() {
      const group = getGroup();
      if (!group) return returnHome();

      chatGroupName.textContent = group.name;
      updateChatMembers(group);
      renderMessages(group);
      showScreen("chat");

      setTimeout(() => {
        messageInput.focus();
        scrollToBottom();
      }, 50);
    }

    function updateChatMembers(group) {
      const names = group.members.map(member => member.name);

      chatMembersText.textContent = names.join(", ");
    }

    function renderMessages(group) {
      messagesContainer.innerHTML = "";

      const dayLabel = document.createElement("div");
      dayLabel.className = "day-label";
      dayLabel.textContent = "Aujourd’hui";
      messagesContainer.appendChild(dayLabel);

      group.messages.forEach(message => {
        if (message.type === "system") {
          const systemMessage = document.createElement("div");
          systemMessage.className = "system-message";
          systemMessage.textContent = message.text;
          messagesContainer.appendChild(systemMessage);
          return;
        }

        const row = document.createElement("div");
        row.className = "message-row";

        if (message.userId === state.userId) {
          row.classList.add("mine");
        }

        const bubble = document.createElement("div");
        bubble.className = "message-bubble";

        if (message.userId !== state.userId) {
          const author = document.createElement("div");
          author.className = "message-author";
          author.textContent = message.userName;
          bubble.appendChild(author);
        }

        const text = document.createElement("div");
        text.className = "message-text";
        text.textContent = message.text;

        const time = document.createElement("span");
        time.className = "message-time";
        time.textContent = formatTime(message.createdAt);

        bubble.append(text, time);
        row.appendChild(bubble);
        messagesContainer.appendChild(row);
      });

      scrollToBottom();
    }

    function sendMessage(event) {
      event.preventDefault();

      const text = messageInput.value.trim();
      if (!text) return;

      const group = getGroup();
      if (!group || group.phase !== "chat") return;

      group.messages.push({
        id: createId(),
        type: "message",
        userId: state.userId,
        userName: state.userName,
        text,
        createdAt: Date.now()
      });

      messageInput.value = "";
      saveGroup(group);
      renderMessages(group);
      messageInput.focus();
    }

    function formatTime(timestamp) {
      return new Intl.DateTimeFormat("fr-FR", {
        hour: "2-digit",
        minute: "2-digit"
      }).format(new Date(timestamp));
    }

    function scrollToBottom() {
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    async function copyGroupCode() {
      try {
        await navigator.clipboard.writeText(state.groupCode);
        copyCodeButton.textContent = "Code copié ✓";
      } catch {
        copyCodeButton.textContent = state.groupCode;
      }

      setTimeout(() => {
        copyCodeButton.textContent = "Copier le code";
      }, 1800);
    }

    function leaveGroup() {
      const group = getGroup();

      if (group) {
        const memberIndex = group.members.findIndex(
          member => member.id === state.userId
        );

        if (memberIndex !== -1) {
          group.members.splice(memberIndex, 1);

          group.messages.push({
            id: createId(),
            type: "system",
            text: state.userName + " a quitté le groupe.",
            createdAt: Date.now()
          });

          if (group.creatorId === state.userId && group.members.length > 0) {
            group.creatorId = group.members[0].id;

            group.messages.push({
              id: createId(),
              type: "system",
              text: group.members[0].name + " est maintenant le créateur.",
              createdAt: Date.now()
            });
          }

          if (group.members.length === 0) {
            localStorage.removeItem(groupStorageKey(group.code));
          } else {
            saveGroup(group);
          }
        }
      }

      returnHome();
    }

    function returnHome() {
      state.userName = "";
      state.groupCode = "";
      state.isCreator = false;

      joinCodeInput.value = "";
      homeError.textContent = "";

      showScreen("home");
    }

    function refreshCurrentGroup() {
      if (!state.groupCode) return;

      const group = getGroup();
      if (!group) return returnHome();

      const userIsStillMember = group.members.some(
        member => member.id === state.userId
      );

      if (!userIsStillMember) return returnHome();

      state.isCreator = group.creatorId === state.userId;

      if (group.phase === "chat") {
        chatGroupName.textContent = group.name;
        updateChatMembers(group);
        renderMessages(group);
        showScreen("chat");
      } else {
        openWaitingRoom();
      }
    }

    createButton.addEventListener("click", createGroup);
    joinButton.addEventListener("click", joinGroup);
    copyCodeButton.addEventListener("click", copyGroupCode);
    continueButton.addEventListener("click", startChat);
    leaveWaitingButton.addEventListener("click", leaveGroup);
    messageForm.addEventListener("submit", sendMessage);

    backToWaitingButton.addEventListener("click", () => {
      openWaitingRoom();
    });

    joinCodeInput.addEventListener("input", event => {
      event.target.value = event.target.value
        .toUpperCase()
        .replace(/[^A-Z0-9]/g, "");
    });

    nameInput.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        createGroup();
      }
    });

    joinCodeInput.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        joinGroup();
      }
    });

    if (channel) {
      channel.addEventListener("message", event => {
        if (
          event.data?.type === "group-update" &&
          event.data.code === state.groupCode
        ) {
          refreshCurrentGroup();
        }
      });
    }

    window.addEventListener("storage", event => {
      if (
        state.groupCode &&
        event.key === groupStorageKey(state.groupCode)
      ) {
        refreshCurrentGroup();
      }
    });
  </script>
</body>
</html>
